    <script>
      // Before first paint: the theme, and whether the opening screen shows.
      // The landing opens at night unless the visitor chose a theme; every
      // other page follows the system or the choice. The opening screen shows
      // on arrival from outside and on reload, never on back and forward and
      // never for a visitor who asked for less motion (after Benji's).
      (function () {
        var d = document.documentElement, mode = "system", pal = "";
        // The app keeps its settings as JSON strings; read them the same way.
        function stored(k) { try { var v = JSON.parse(localStorage.getItem(k)); return typeof v === "string" ? v : ""; } catch (e) { return ""; } }
        mode = stored("gpi-theme") || "system"; pal = stored("gpi-palette");
        try { var q = new URLSearchParams(location.search).get("palette"); if (q) { pal = q; localStorage.setItem("gpi-palette", JSON.stringify(q)); } } catch (e) {}
        d.dataset.palette = pal || "bugambilia";
        var home = location.pathname.replace(/\/+$/, "") === "/mock";
        var dark = mode === "dark" || (mode === "system" && (home || matchMedia("(prefers-color-scheme: dark)").matches));
        d.dataset.theme = dark ? "dark" : "light";
        try {
          var nav = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
          var type = nav ? nav.type : "navigate", here = false;
          try { here = !!document.referrer && new URL(document.referrer).host === location.host; } catch (e) {}
          if ((type === "reload" || (type === "navigate" && !here)) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
            d.setAttribute("data-loading", "");
            setTimeout(function () { d.removeAttribute("data-loading"); }, 8000);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* The opening screen paints before the bundle arrives, in the chosen palette. */
      .loader { display: none; }
      html[data-loading] .loader { display: grid; }
      html[data-loading] body { overflow: hidden; }
      .loader { position: fixed; inset: 0; z-index: 100; place-items: center; background: var(--paper, #241c1c); color: var(--ink, #f4f0ea); transition: transform 600ms cubic-bezier(0.77, 0, 0.175, 1); }
      .loader.is-out { transform: translateY(-100%); }
      .loader__in { display: grid; justify-items: center; gap: 22px; padding: 0 16px; text-align: center; }
      .loader__name { font: 300 clamp(2rem, 1rem + 3vw, 3.5rem) / 1 "Jura Variable", "Jura", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; }
      .loader__line { font: 500 0.6875rem / 1 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.6; }
      .loader__bar { width: 220px; height: 3px; background: rgba(128, 128, 128, 0.25); overflow: hidden; }
      .loader__bar span { display: block; height: 100%; background: var(--accent, #ff7fc8); transform: scaleX(var(--p, 0)); transform-origin: left; transition: transform 300ms cubic-bezier(0.23, 1, 0.32, 1); }
      .loader__n { font: 300 1rem / 1 "Jura Variable", "Jura", "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; opacity: 0.7; }
    </style>
