# Builds the portal, prints every document to PDF from the same source, runs
# the compliance checks, and publishes the built site to the `render` branch.
# The Render static site serves that branch as it is (see render.yaml), so
# Render never builds anything: Chromium for the PDF step lives here.
#
# Setup, once: Render dashboard -> New -> Blueprint -> this repository. The
# `render` branch exists after the first run of this workflow on main.
name: Build and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The site's public URL, for the footer and the manifest. Override with a
  # PORTAL_URL repository variable (Settings -> Secrets and variables ->
  # Actions -> Variables) if the Render name changes or a domain is added.
  PORTAL_URL: ${{ vars.PORTAL_URL || 'https://gpi-portal.onrender.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium for the PDF step
        run: npx playwright install --with-deps chromium
      - name: Generate PDFs
        run: npm run pdf
      - name: Emit corpus
        run: npm run corpus
      - name: Validate
        run: npm run validate
      - name: Publish the built site to the render branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: render
          publish_dir: ./out
          force_orphan: true
          commit_message: "Site built from ${{ github.sha }}"
